<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101715"><link rel="manifest" href="./manifest.webmanifest"><title>训练工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#101715;color:#eaf4ef;font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 16px 40px}main{max-width:580px;margin:auto}h1{font-size:27px}.sub,small{color:#a4b8ac}.panel{background:#1b2823;border:1px solid #354b3d;border-radius:18px;padding:18px;margin:15px 0}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0}.day{padding:12px 0;border:1px solid #47604e;border-radius:10px;background:#23352b;color:#eaf4ef}.active,.primary{background:#a9e7be!important;color:#12251a!important}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #35483d}.task span{flex:1}.task b{display:block}.task small{display:block;margin-top:4px}input{width:23px;height:23px;accent-color:#a9e7be}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:9px;background:#35483d;border-radius:10px;overflow:hidden}.fill{height:100%;background:#a9e7be;width:0}.timer{font-size:42px;font-weight:700;margin:15px 0}button{cursor:pointer}.btn{border:0;border-radius:10px;padding:12px;background:#31473a;color:white;font-weight:600}.note{line-height:1.7;color:#b8c9bd;font-size:13px}</style></head><body><main><p class="sub">4-WEEK PROGRAM · 2026.11.26 — 12.23</p><h1>减脂 × 肌力训练</h1><div class="row"><small>每周5天力量 / 2天恢复 · 周四自动切换</small><span id="weekly"></span></div><div id="days" class="days"></div><section class="panel"><div class="row"><div><small id="type"></small><h2 id="focus"></h2></div><small id="date"></small></div><p class="note">按顺序完成。组间休息45–60秒，动作间休息20–30秒；保留2–4次余力。</p><div id="tasks"></div><p class="row">当天进度 <span id="count"></span></p><div class="progress"><div class="fill" id="fill"></div></div></section><section class="panel"><h2>休息计时器</h2><div id="clock" class="timer">00:45</div><div class="row"><button class="btn primary" id="toggle">开始 / 暂停</button><button class="btn" id="reset">45秒</button><button class="btn" id="sixty">60秒</button></div></section><section class="panel"><h2>安全提醒</h2><p class="note">力量训练前热身3–5分钟。力量日有氧以平地或0–2%低坡度步行开始，症状允许时逐步达到20–25分钟。恢复日不强制爬坡。腿麻或放射痛加重时停止；进行性腿无力、会阴麻木或大小便功能异常应立即就医。</p><p class="note">打卡仅保存在当前设备浏览器中，清除网站数据会丢失记录。</p></section></main><script>
const data=[
['11/26','四','臀部＋核心','力量',[['臀桥','2组×12次'],['蚌式开合','2组×每侧12次'],['死虫式','2组×每侧8次'],['鸟狗式','2组×每侧6次']]],
['11/27','五','背部＋手臂','力量',[['弹力带坐姿划船','2组×12次'],['弹力带拉开','2组×10次'],['弹力带二头弯举','2组×12次'],['靠墙俯卧撑','2组×10次']]],
['11/28','六','腿部＋臀部','力量',[['高椅坐站','2组×10次'],['扶椅提踵','2组×15次'],['臀桥','2组×12次'],['站姿侧抬腿','2组×每侧10次']]],
['11/29','日','轻度核心＋恢复','恢复',[['轻松步行热身','3分钟'],['死虫式简化版','2组×每侧6次'],['鸟狗式简化版','2组×每侧6次'],['仰卧呼吸训练','3分钟']]],
['11/30','一','胸肩＋背部','力量',[['靠墙俯卧撑','2组×12次'],['弹力带坐姿划船','2组×12次'],['弹力带外旋','2组×每侧10次'],['弹力带拉开','2组×12次']]],
['12/01','二','臀腿＋核心','力量',[['高椅坐站','2组×10次'],['臀桥','2组×12次'],['蚌式开合','2组×每侧12次'],['死虫式','2组×每侧8次']]],
['12/02','三','主动恢复','恢复',[['平地轻松步行','10–20分钟'],['舒适范围内肩部活动','2分钟'],['仰卧呼吸训练','3分钟'],['症状与疲劳检查','2分钟']]]];
const start=new Date(2026,10,26);function getWeek(){let now=new Date();now.setHours(0,0,0,0);return Math.max(0,Math.min(3,Math.floor((now-start)/604800000)))}let week=getWeek();let state={};try{state=JSON.parse(localStorage.getItem('fitness-2026-w4')||'{}')}catch{}let selected=Math.max(0,Math.min(6,Math.floor((new Date().setHours(0,0,0,0)-start.getTime())/86400000)%7));const weekPlans=[['基础适应','保持2组，练习动作控制'],['耐力进阶','症状稳定时每组增加2次'],['训练量进阶','仅部分主要动作增加至3组'],['巩固进阶','动作稳定时适度增加弹力带阻力']];function taskInfo(t,i){if(week===0||data[selected][3]!=='力量')return t;let s=t[1];if(week===1){s=s.replace(/(\d+)次/g,(m,n)=> (+n+2)+'次')}else if(week===2){if(i<2)s=s.replace('2组','3组');else s=s.replace(/(\d+)次/g,(m,n)=>(+n+2)+'次')}else if(week===3){if(i<2)s=s.replace('2组','3组');s+=' · 可选较强弹力带'}return [t[0],s]}const $=id=>document.getElementById(id);function save(){localStorage.setItem('fitness-2026-w4',JSON.stringify(state))}function progress(){let n=0;for(let i=0;i<5;i++)if(state[week+'-'+selected+'-'+i])n++;$('count').textContent=n+'/5';$('fill').style.width=n*20+'%';let completed=0;for(let d=0;d<7;d++)if(data[d][4].every((_,i)=>state[week+'-'+d+'-'+i]))completed++;$('weekly').textContent='第'+(week+1)+'周 · '+completed+'/7天完成'}function render(){let actual=getWeek();if(actual!==week)week=actual;$('days').innerHTML=data.map((d,i)=>'<button class="day '+(selected===i?'active':'')+'" data-day="'+i+'">周'+d[1]+'<br>'+String(new Date(2026,10,26+week*7+i).getDate())+'</button>').join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;render()});let d=data[selected];$('type').textContent='第'+(week+1)+'周 · '+weekPlans[week][0]+' · '+weekPlans[week][1]+' · '+d[3]+'训练';$('focus').textContent=d[2];$('date').textContent=(new Date(2026,10,26+week*7+selected)).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});let tasks=[...d[4].map(taskInfo),[d[3]==='力量'?'低坡度有氧（可选）':'恢复有氧（可选）',d[3]==='力量'?'目标20–25分钟，症状允许时':'按身体状态选择']];$('tasks').innerHTML=tasks.map((t,i)=>'<label class="task"><input type="checkbox" data-task="'+week+'-'+selected+'-'+i+'" '+(state[week+'-'+selected+'-'+i]?'checked':'')+'><span><b>'+t[0]+'</b><small>'+t[1]+'</small></span></label>').join('');document.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{state[c.dataset.task]=c.checked;save();progress()});progress()}let secs=45,timer=null;function showClock(){$('clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}$('toggle').onclick=()=>{if(timer){clearInterval(timer);timer=null;return}timer=setInterval(()=>{if(secs>0){secs--;showClock()}else{clearInterval(timer);timer=null;navigator.vibrate?.(200)}},1000)};function setClock(n){clearInterval(timer);timer=null;secs=n;showClock()}$('reset').onclick=()=>setClock(45);$('sixty').onclick=()=>setClock(60);render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
