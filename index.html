<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101715"><link rel="manifest" href="./manifest.webmanifest"><title>训练工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#101715;color:#eaf4ef;font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 16px 40px}main{max-width:580px;margin:auto}h1{font-size:27px}.sub,small{color:#a4b8ac}.panel{background:#1b2823;border:1px solid #354b3d;border-radius:18px;padding:18px;margin:15px 0}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0}.day{padding:12px 0;border:1px solid #47604e;border-radius:10px;background:#23352b;color:#eaf4ef}.active,.primary{background:#a9e7be!important;color:#12251a!important}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #35483d}.task span{flex:1}.exercise{border-bottom:1px solid #35483d}.exercise .task{border-bottom:0}.exercise-toggle{flex:1;text-align:left;background:none;border:0;color:inherit;padding:0;min-width:0}.exercise-toggle b{font-size:15px}.chevron{color:#a9e7be;font-size:18px;margin-left:8px}.instruction{padding:0 8px 15px 36px;color:#c9dacf;line-height:1.65;font-size:13px}.instruction[hidden]{display:none}.exercise input{flex-shrink:0}.task b{display:block}.task small{display:block;margin-top:4px}input{width:23px;height:23px;accent-color:#a9e7be}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:9px;background:#35483d;border-radius:10px;overflow:hidden}.fill{height:100%;background:#a9e7be;width:0}.timer{font-size:42px;font-weight:700;margin:15px 0}button{cursor:pointer}.btn{border:0;border-radius:10px;padding:12px;background:#31473a;color:white;font-weight:600}.note{line-height:1.7;color:#b8c9bd;font-size:13px}</style></head><body><main><p class="sub">4-WEEK PROGRAM · 2026.11.26 — 12.23</p><h1>减脂 × 肌力训练</h1><div class="row"><small>每周5天力量 / 2天恢复 · 周四自动切换</small><span id="weekly"></span></div><div id="days" class="days"></div><section class="panel"><div class="row"><div><small id="type"></small><h2 id="focus"></h2></div><small id="date"></small></div><p class="note">按顺序完成。组间休息45–60秒，动作间休息20–30秒；保留2–4次余力。</p><div id="tasks"></div><p class="row">当天进度 <span id="count"></span></p><div class="progress"><div class="fill" id="fill"></div></div></section><section class="panel"><h2>休息计时器</h2><div id="clock" class="timer">00:45</div><div class="row"><button class="btn primary" id="toggle">开始 / 暂停</button><button class="btn" id="reset">45秒</button><button class="btn" id="sixty">60秒</button></div></section><section class="panel"><h2>安全提醒</h2><p class="note">力量训练前热身3–5分钟。力量日有氧以平地或0–2%低坡度步行开始，症状允许时逐步达到20–25分钟。恢复日不强制爬坡。腿麻或放射痛加重时停止；进行性腿无力、会阴麻木或大小便功能异常应立即就医。</p><p class="note">打卡仅保存在当前设备浏览器中，清除网站数据会丢失记录。</p></section></main><script>
const data=[
['11/26','四','臀部＋核心','力量',[['臀桥','2组×12次'],['蚌式开合','2组×每侧12次'],['死虫式','2组×每侧8次'],['鸟狗式','2组×每侧6次']]],
['11/27','五','背部＋手臂','力量',[['弹力带坐姿划船','2组×12次'],['弹力带拉开','2组×10次'],['弹力带二头弯举','2组×12次'],['靠墙俯卧撑','2组×10次']]],
['11/28','六','腿部＋臀部','力量',[['高椅坐站','2组×10次'],['扶椅提踵','2组×15次'],['臀桥','2组×12次'],['站姿侧抬腿','2组×每侧10次']]],
['11/29','日','轻度核心＋恢复','恢复',[['轻松步行热身','3分钟'],['死虫式简化版','2组×每侧6次'],['鸟狗式简化版','2组×每侧6次'],['仰卧呼吸训练','3分钟']]],
['11/30','一','胸肩＋背部','力量',[['靠墙俯卧撑','2组×12次'],['弹力带坐姿划船','2组×12次'],['弹力带外旋','2组×每侧10次'],['弹力带拉开','2组×12次']]],
['12/01','二','臀腿＋核心','力量',[['高椅坐站','2组×10次'],['臀桥','2组×12次'],['蚌式开合','2组×每侧12次'],['死虫式','2组×每侧8次']]],
['12/02','三','主动恢复','恢复',[['平地轻松步行','10–20分钟'],['舒适范围内肩部活动','2分钟'],['仰卧呼吸训练','3分钟'],['症状与疲劳检查','2分钟']]]];
const start=new Date(2026,10,26);function getWeek(){let now=new Date();now.setHours(0,0,0,0);return Math.max(0,Math.min(3,Math.floor((now-start)/604800000)))}let week=getWeek();let state={};try{state=JSON.parse(localStorage.getItem('fitness-2026-w4')||'{}')}catch{}let selected=Math.max(0,Math.min(6,Math.floor((new Date().setHours(0,0,0,0)-start.getTime())/86400000)%7));const weekPlans=[['基础适应','保持2组，练习动作控制'],['耐力进阶','症状稳定时每组增加2次'],['训练量进阶','仅部分主要动作增加至3组'],['巩固进阶','动作稳定时适度增加弹力带阻力']];function taskInfo(t,i){if(week===0||data[selected][3]!=='力量')return t;let s=t[1];if(week===1){s=s.replace(/(\d+)次/g,(m,n)=> (+n+2)+'次')}else if(week===2){if(i<2)s=s.replace('2组','3组');else s=s.replace(/(\d+)次/g,(m,n)=>(+n+2)+'次')}else if(week===3){if(i<2)s=s.replace('2组','3组');s+=' · 可选较强弹力带'}return [t[0],s]}const tutorials={"臀桥":"仰卧屈膝，双脚与髋同宽踩地。收紧腹部、夹臀抬髋，肩—髋—膝大致成线；缓慢放下。不要挺腰。","蚌式开合":"侧卧屈髋屈膝，双脚并拢。骨盆不后翻，上侧膝缓慢打开再合拢；幅度不必大。","死虫式":"仰卧，屈膝抬腿至舒适位置，双臂向上。腹部轻收，交替缓慢伸出对侧手脚再收回；腰不拱起。","鸟狗式":"四点跪姿，背部保持自然中立。缓慢伸出对侧手和腿，停1–2秒收回；不要转髋或塌腰。","弹力带坐姿划船":"坐稳，弹力带绕过固定可靠的脚掌或锚点。背部中立，双肘向后拉至身体两侧，缓慢还原；不耸肩。","弹力带拉开":"双手在胸前握带，肘微屈。肩膀下沉，向两侧拉开至舒适幅度，再缓慢回收；不要挺腰。","弹力带二头弯举":"站稳踩住弹力带，双肘贴近身体。弯肘将手拉向肩部，缓慢放下；上臂尽量不动。","靠墙俯卧撑":"面对墙站立，双掌撑墙与肩同高。身体保持一条直线，屈肘靠近墙，再推回；避免塌腰。","高椅坐站":"坐在稳固高椅前部，双脚踩实。身体轻微前倾、用腿臀发力站起，再缓慢坐下；不弯腰塌背。","扶椅提踵":"扶稳固椅背站立。缓慢抬起脚跟、用前脚掌支撑，再缓慢落下；不要弹跳。","站姿侧抬腿":"扶椅站稳，躯干直立。单腿向侧方小幅抬起再放下，脚尖朝前；不侧弯腰。","死虫式简化版":"仰卧屈膝、双脚踩地。腹部轻收，交替抬起一只脚几厘米再放下；腰部保持稳定。","鸟狗式简化版":"四点跪姿，背部中立。一次只向前伸一只手，或向后滑一只脚；不晃动骨盆。","仰卧呼吸训练":"仰卧屈膝，双脚踩地。鼻吸气使下肋轻微扩张，缓慢呼气；不屏气、不用力压腰。","轻松步行热身":"平地慢走3分钟，逐步加快至舒适速度；不要追求心率。","平地轻松步行":"选择平坦地面，以能轻松交谈的速度步行；腰腿不适时缩短或停止。","舒适范围内肩部活动":"坐或站直，双肩缓慢前后绕圈，手臂在无痛范围内轻轻抬放。","症状与疲劳检查":"记录今天腰痛、腿麻或放射痛是否比训练前加重；如加重，下次降低强度并咨询专业人员。","低坡度有氧（可选）":"先平地或0–2%低坡步行，以能说完整句子的强度进行；出现腿麻或放射痛加重立即停止。","恢复有氧（可选）":"按当天状态选择平地轻松步行，不强制时长或坡度。"};const $=id=>document.getElementById(id);function save(){localStorage.setItem('fitness-2026-w4',JSON.stringify(state))}function progress(){let n=0;for(let i=0;i<5;i++)if(state[week+'-'+selected+'-'+i])n++;$('count').textContent=n+'/5';$('fill').style.width=n*20+'%';let completed=0;for(let d=0;d<7;d++)if(data[d][4].every((_,i)=>state[week+'-'+d+'-'+i]))completed++;$('weekly').textContent='第'+(week+1)+'周 · '+completed+'/7天完成'}function render(){let actual=getWeek();if(actual!==week)week=actual;$('days').innerHTML=data.map((d,i)=>'<button class="day '+(selected===i?'active':'')+'" data-day="'+i+'">周'+d[1]+'<br>'+String(new Date(2026,10,26+week*7+i).getDate())+'</button>').join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;render()});let d=data[selected];$('type').textContent='第'+(week+1)+'周 · '+weekPlans[week][0]+' · '+weekPlans[week][1]+' · '+d[3]+'训练';$('focus').textContent=d[2];$('date').textContent=(new Date(2026,10,26+week*7+selected)).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});let tasks=[...d[4].map(taskInfo),[d[3]==='力量'?'低坡度有氧（可选）':'恢复有氧（可选）',d[3]==='力量'?'目标20–25分钟，症状允许时':'按身体状态选择']];$('tasks').innerHTML=tasks.map((t,i)=>'<div class="exercise"><div class="task"><button type="button" class="exercise-toggle" data-expand="'+i+'" aria-expanded="false"><b>'+t[0]+'</b><small>'+t[1]+'</small></button><span class="chevron" id="arrow-'+i+'">⌄</span><input aria-label="完成'+t[0]+'" type="checkbox" data-task="'+week+'-'+selected+'-'+i+'" '+(state[week+'-'+selected+'-'+i]?'checked':'')+'></div><div class="instruction" id="guide-'+i+'" hidden>'+ (tutorials[t[0]]||'按舒适幅度缓慢完成，避免憋气及腰腿症状加重。') +'</div></div>').join('');document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{const i=b.dataset.expand,g=$('guide-'+i),open=g.hidden;g.hidden=!open;b.setAttribute('aria-expanded',String(open));$('arrow-'+i).textContent=open?'⌃':'⌄'});document.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{state[c.dataset.task]=c.checked;save();progress()});progress()}let secs=45,timer=null;function showClock(){$('clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}$('toggle').onclick=()=>{if(timer){clearInterval(timer);timer=null;return}timer=setInterval(()=>{if(secs>0){secs--;showClock()}else{clearInterval(timer);timer=null;navigator.vibrate?.(200)}},1000)};function setClock(n){clearInterval(timer);timer=null;secs=n;showClock()}$('reset').onclick=()=>setClock(45);$('sixty').onclick=()=>setClock(60);render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
